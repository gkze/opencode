name: Fork release
run-name: Fork release • ${{ github.ref_name }}

on:
  push:
    tags: [fork-v*]
  workflow_dispatch:
  workflow_call:
    secrets:
      FORK_PUSH_TOKEN:
        required: true
    inputs:
      source_ref:
        type: string
        required: true
      nightly:
        type: boolean
        default: false
      old:
        type: string
        default: ""
      upstream:
        type: string
        default: ""
      report_run:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENCODE_CHANNEL: dev
  OPENCODE_FORK: "1"

jobs:
  version:
    if: github.repository == 'gkze/opencode'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: version
        env:
          NIGHTLY: ${{ inputs.nightly || false }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import { releaseVersion } from './script/fork/version.mjs'
          const result = releaseVersion({
            base: JSON.parse(fs.readFileSync('package.json')).version,
            nightly: process.env.NIGHTLY === 'true',
            tag: process.env.REF_TYPE === 'tag' ? process.env.REF_NAME : undefined,
            run: process.env.GITHUB_RUN_NUMBER,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            date: new Date(),
          })
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(result).map(([key, value]) => `${key}=${value}\n`).join(''))
          JS

  cli:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      manifest: ${{ steps.manifest.outputs.cli }}
      manifest-darwin-arm64: ${{ steps.manifest.outputs.darwin-arm64 }}
      manifest-darwin-x64: ${{ steps.manifest.outputs.darwin-x64 }}
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate refreshed patch stack
        if: inputs.nightly
        run: bun run check
      - name: Test fork package installation and update policy
        working-directory: packages/cli
        run: bun test test/fork-version.test.ts test/fork-nightly.test.ts test/fork-package.test.ts test/fork-updater.test.ts test/upgrade.test.ts test/updater-install.test.ts
      - name: Test desktop packaging contracts
        working-directory: packages/desktop
        run: bun test electron-builder.fork.test.ts electron-builder.config.test.ts
      - name: Build all CLI targets and embedded web UI
        run: bun packages/cli/script/build.ts
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          GH_TOKEN: ${{ github.token }}
      - name: Smoke test native CLI
        run: |
          test "$(packages/cli/dist/cli-linux-x64/bin/opencode --version)" = "opencode v$OPENCODE_VERSION"
          packages/cli/dist/cli-linux-x64/bin/opencode --help > /dev/null
      - name: Record uploaded CLI files
        id: manifest
        run: |
          {
            echo 'cli<<MANIFEST'
            node script/fork/manifest.mjs write packages/cli/dist packages/cli/dist/cli-*
            echo MANIFEST
            for ARCH in arm64 x64; do
              DIR=$([ "$ARCH" = arm64 ] && echo cli-darwin-arm64 || echo cli-darwin-x64-baseline)
              echo "darwin-$ARCH<<MANIFEST"
              node script/fork/manifest.mjs write "packages/cli/dist/$DIR" "packages/cli/dist/$DIR"
              echo MANIFEST
            done
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-cli
          path: packages/cli/dist/cli-*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-cli-darwin-arm64
          path: packages/cli/dist/cli-darwin-arm64
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-cli-darwin-x64
          path: packages/cli/dist/cli-darwin-x64-baseline
          if-no-files-found: error
          retention-days: 3

  desktop:
    needs: [version, cli]
    runs-on: macos-15-intel
    timeout-minutes: 60
    outputs:
      manifest: ${{ steps.desktop.outputs.manifest }}
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: desktop
        uses: ./.github/actions/fork-desktop
        with:
          arch: x64
          cli-manifest: ${{ needs.cli.outputs.manifest-darwin-x64 }}

  # Hosted macOS arm64 capacity is constrained, and a job no runner acquires is cancelled after about 45
  # minutes without running a step. The first step records acquisition, so only that case falls back to
  # cross-packaging on Intel; a native build that starts and fails still blocks the release.
  desktop-arm64:
    needs: [version, cli]
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    outputs:
      acquired: ${{ steps.acquired.outputs.value }}
      built: ${{ steps.built.outputs.value }}
      manifest: ${{ steps.desktop.outputs.manifest }}
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - id: acquired
        run: echo "value=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: desktop
        uses: ./.github/actions/fork-desktop
        with:
          arch: arm64
          cli-manifest: ${{ needs.cli.outputs.manifest-darwin-arm64 }}
      - id: built
        run: echo "value=true" >> "$GITHUB_OUTPUT"

  desktop-arm64-fallback:
    needs: [version, cli, desktop-arm64]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.cli.result == 'success' && needs.desktop-arm64.outputs.built != 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    outputs:
      manifest: ${{ steps.desktop.outputs.manifest }}
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Require that no arm64 runner acquired the native build
        env:
          ACQUIRED: ${{ needs.desktop-arm64.outputs.acquired }}
        run: |
          if [ "$ACQUIRED" = true ]; then
            echo "::error::The native arm64 desktop build ran and failed; not falling back to cross-packaging"
            exit 1
          fi
          echo "::warning::No arm64 runner acquired the native desktop build; cross-packaging arm64 on Intel"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: desktop
        uses: ./.github/actions/fork-desktop
        with:
          arch: arm64
          cli-manifest: ${{ needs.cli.outputs.manifest-darwin-arm64 }}

  package:
    needs: [version, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      manifest-npm: ${{ steps.manifest.outputs.npm }}
      manifest-assets: ${{ steps.manifest.outputs.assets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-cli
          path: packages/cli/dist
      - name: Verify downloaded CLI files
        env:
          MANIFEST: ${{ needs.cli.outputs.manifest }}
        run: printf '%s\n' "$MANIFEST" | node script/fork/manifest.mjs check packages/cli/dist
      - run: bun script/fork/package.ts packages/cli/dist release
      - name: Record uploaded release files
        id: manifest
        run: |
          {
            echo 'npm<<MANIFEST'
            node script/fork/manifest.mjs write release/npm release/npm
            echo MANIFEST
            echo 'assets<<MANIFEST'
            node script/fork/manifest.mjs write release/assets release/assets
            echo MANIFEST
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-npm
          path: release/npm
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-cli-assets
          path: release/assets
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: [version, package, desktop, desktop-arm64, desktop-arm64-fallback]
    if: >-
      ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.package.result == 'success' &&
      needs.desktop.result == 'success' &&
      (needs.desktop-arm64.outputs.built == 'true' || needs.desktop-arm64-fallback.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NPM_DIST_TAG: ${{ inputs.nightly && 'nightly' || 'fork' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-npm
          path: release/npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@gkze"
      - name: Verify downloaded npm packages
        env:
          MANIFEST: ${{ needs.package.outputs.manifest-npm }}
        run: printf '%s\n' "$MANIFEST" | node script/fork/manifest.mjs check release/npm
      - name: Publish native npm packages, then launcher
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/script/fork/publish.mjs" "$GITHUB_WORKSPACE/release/npm"

  # Skipped arm64 jobs upstream would otherwise skip these jobs too.
  verify:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@gkze"
      - name: Verify registry installation with read-only credentials
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install --prefix "$RUNNER_TEMP/fork-install" "@gkze/opencode@$VERSION"
          test "$("$RUNNER_TEMP/fork-install/node_modules/.bin/opencode" --version)" = "opencode v$VERSION"

  announce:
    needs: [version, package, desktop, desktop-arm64, desktop-arm64-fallback, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      TITLE: ${{ needs.version.outputs.title }}
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}
      NPM_DIST_TAG: ${{ inputs.nightly && 'nightly' || 'fork' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-cli-assets
          path: release/assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fork-desktop-*
          path: release/assets
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify downloaded release files
        env:
          ASSETS: ${{ needs.package.outputs.manifest-assets }}
          DESKTOP_X64: ${{ needs.desktop.outputs.manifest }}
          DESKTOP_ARM64: ${{ needs.desktop-arm64.outputs.manifest || needs.desktop-arm64-fallback.outputs.manifest }}
        run: printf '%s\n' "$ASSETS" "$DESKTOP_X64" "$DESKTOP_ARM64" | node script/fork/manifest.mjs check release/assets
      - name: Checksums
        working-directory: release/assets
        run: sha256sum -- * > SHA256SUMS
      - name: Promote validated nightly and create immutable tag
        if: inputs.nightly
        env:
          FORK_OLD: ${{ inputs.old }}
          FORK_CANDIDATE: ${{ inputs.source_ref }}
          FORK_UPSTREAM: ${{ inputs.upstream }}
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          node script/fork/nightly.mjs promote
          if ! git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$FORK_CANDIDATE"
            git push origin "refs/tags/$TAG"
          fi
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$FORK_CANDIDATE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.nightly
        with:
          name: nightly-output
          path: reconciliation
          run-id: ${{ inputs.report_run }}
          github-token: ${{ github.token }}
      - name: Publish GitHub prerelease
        run: |
          cat > notes.md <<'NOTES'
          ## Included

          CLI/TUI with embedded web UI for macOS, Linux, and Windows; desktop packages for Apple Silicon and Intel Macs.

          ## Installation

          Desktop: extract the matching macOS ZIP into `~/Applications`.
          CLI: configure the `@gkze` scope for GitHub Packages with `read:packages` authentication, then use the Bun command below.

          NOTES
          printf '\n```sh\nbun add --global --trust @gkze/opencode@%s\n```\n' "$VERSION" >> notes.md
          printf '\nDesktop packages are ad-hoc signed, not Apple-notarized. Upstream automatic updates are disabled. Install future fork releases manually or update the package with Bun.\n' >> notes.md
          printf '\n## Build\n\n- Version: `%s`\n- Source: `%s`\n- Channel: `%s`\n- [Build log](https://github.com/%s/actions/runs/%s)\n' "$VERSION" "$SOURCE_REF" "$NPM_DIST_TAG" "$GH_REPO" "$GITHUB_RUN_ID" >> notes.md
          if [ "$NPM_DIST_TAG" = nightly ]; then
            node --input-type=module <<'JS'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync('reconciliation/report.json'))
          fs.appendFileSync('notes.md', '\n' + report.summary + '\n\n' + report.patches.map(p => `- ${p.action}: ${p.old.slice(0, 10)} — ${p.reason}`).join('\n'))
          JS
            cp reconciliation/report.json release/assets/RECONCILIATION.json
            (cd release/assets && sha256sum RECONCILIATION.json >> SHA256SUMS)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/assets/* --clobber
          else
            gh release create "$TAG" release/assets/* --verify-tag --prerelease --title "$TITLE" --notes-file notes.md
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@gkze"
      - name: Advance verified consumer dist-tag
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm dist-tag add "@gkze/opencode@$VERSION" "$NPM_DIST_TAG" --registry https://npm.pkg.github.com
