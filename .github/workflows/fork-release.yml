name: Fork release
run-name: Fork release • ${{ github.ref_name }}

on:
  push:
    tags: [fork-v*]
  workflow_dispatch:
  workflow_call:
    secrets:
      FORK_PUSH_TOKEN:
        required: true
    inputs:
      source_ref:
        type: string
        required: true
      nightly:
        type: boolean
        default: false
      old:
        type: string
        default: ""
      upstream:
        type: string
        default: ""
      report_run:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENCODE_CHANNEL: dev
  OPENCODE_FORK: "1"

jobs:
  version:
    if: github.repository == 'gkze/opencode'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: version
        env:
          NIGHTLY: ${{ inputs.nightly || false }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          import { releaseVersion } from './script/fork/version.mjs'
          const result = releaseVersion({
            base: JSON.parse(fs.readFileSync('package.json')).version,
            nightly: process.env.NIGHTLY === 'true',
            tag: process.env.REF_TYPE === 'tag' ? process.env.REF_NAME : undefined,
            run: process.env.GITHUB_RUN_NUMBER,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            date: new Date(),
          })
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(result).map(([key, value]) => `${key}=${value}\n`).join(''))
          JS

  cli:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate refreshed patch stack
        if: inputs.nightly
        run: bun run check
      - name: Test fork package installation and update policy
        working-directory: packages/cli
        run: bun test test/fork-version.test.ts test/fork-nightly.test.ts test/fork-package.test.ts test/fork-updater.test.ts test/upgrade.test.ts test/updater-install.test.ts
      - name: Test desktop packaging contracts
        working-directory: packages/desktop
        run: bun test electron-builder.fork.test.ts electron-builder.config.test.ts
      - name: Build all CLI targets and embedded web UI
        run: bun packages/cli/script/build.ts
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          GH_TOKEN: ${{ github.token }}
      - name: Smoke test native CLI
        run: |
          test "$(packages/cli/dist/cli-linux-x64/bin/opencode --version)" = "opencode v$OPENCODE_VERSION"
          packages/cli/dist/cli-linux-x64/bin/opencode --help > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-cli
          path: packages/cli/dist/cli-*
          if-no-files-found: error
          retention-days: 3

  desktop:
    needs: [version, cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      OPENCODE_CLI_TARGET: ${{ matrix.target }}
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-cli
          path: packages/cli/dist
      - name: Build desktop with this release's CLI
        working-directory: packages/desktop
        run: |
          bun scripts/prepare.ts
          bun run build
      - name: Package with ad-hoc signing
        working-directory: packages/desktop
        env:
          ARCH: ${{ matrix.arch }}
        run: bunx electron-builder --mac --"$ARCH" --publish never --config electron-builder.fork.ts
      - name: Verify packaged application and CLI
        working-directory: packages/desktop
        run: |
          APP=$(find dist -maxdepth 2 -name 'OpenCode Dev.app' -type d | head -n 1)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/OpenCode Dev" -e 'if (!process.versions.electron) process.exit(1)'
          test "$("$APP/Contents/Resources/opencode-cli" --version)" = "opencode v$OPENCODE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'io.github.gkze.opencode'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-desktop-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 3

  package:
    needs: [version, cli, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-cli
          path: packages/cli/dist
      - run: bun script/fork/package.ts packages/cli/dist release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fork-desktop-*
          path: release/assets
          merge-multiple: true
      - name: Checksums
        working-directory: release/assets
        run: sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-release
          path: |
            release/assets
            release/npm
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [version, package]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NPM_DIST_TAG: ${{ inputs.nightly && 'nightly' || 'fork' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fork-release
          path: release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@gkze"
      - name: Publish native npm packages, then launcher
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/script/fork/publish.mjs" "$GITHUB_WORKSPACE/release/npm"

  verify:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@gkze"
      - name: Verify registry installation with read-only credentials
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install --prefix "$RUNNER_TEMP/fork-install" "@gkze/opencode@$VERSION"
          test "$("$RUNNER_TEMP/fork-install/node_modules/.bin/opencode" --version)" = "opencode v$VERSION"

  announce:
    needs: [version, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      TITLE: ${{ needs.version.outputs.title }}
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}
      NPM_DIST_TAG: ${{ inputs.nightly && 'nightly' || 'fork' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fork-release
          path: release
      - name: Promote validated nightly and create immutable tag
        if: inputs.nightly
        env:
          FORK_OLD: ${{ inputs.old }}
          FORK_CANDIDATE: ${{ inputs.source_ref }}
          FORK_UPSTREAM: ${{ inputs.upstream }}
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          node script/fork/nightly.mjs promote
          if ! git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$FORK_CANDIDATE"
            git push origin "refs/tags/$TAG"
          fi
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$FORK_CANDIDATE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.nightly
        with:
          name: nightly-output
          path: reconciliation
          run-id: ${{ inputs.report_run }}
          github-token: ${{ github.token }}
      - name: Publish GitHub prerelease
        run: |
          cat > notes.md <<'NOTES'
          ## Included

          CLI/TUI with embedded web UI for macOS, Linux, and Windows; desktop packages for Apple Silicon and Intel Macs.

          ## Installation

          Desktop: extract the matching macOS ZIP into `~/Applications`.
          CLI: configure the `@gkze` scope for GitHub Packages with `read:packages` authentication, then use the Bun command below.

          NOTES
          printf '\n```sh\nbun add --global --trust @gkze/opencode@%s\n```\n' "$VERSION" >> notes.md
          printf '\nDesktop packages are ad-hoc signed, not Apple-notarized. Upstream automatic updates are disabled. Install future fork releases manually or update the package with Bun.\n' >> notes.md
          printf '\n## Build\n\n- Version: `%s`\n- Source: `%s`\n- Channel: `%s`\n- [Build log](https://github.com/%s/actions/runs/%s)\n' "$VERSION" "$SOURCE_REF" "$NPM_DIST_TAG" "$GH_REPO" "$GITHUB_RUN_ID" >> notes.md
          if [ "$NPM_DIST_TAG" = nightly ]; then
            node --input-type=module <<'JS'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync('reconciliation/report.json'))
          fs.appendFileSync('notes.md', '\n' + report.summary + '\n\n' + report.patches.map(p => `- ${p.action}: ${p.old.slice(0, 10)} — ${p.reason}`).join('\n'))
          JS
            cp reconciliation/report.json release/assets/RECONCILIATION.json
            (cd release/assets && sha256sum RECONCILIATION.json >> SHA256SUMS)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/assets/* --clobber
          else
            gh release create "$TAG" release/assets/* --verify-tag --prerelease --title "$TITLE" --notes-file notes.md
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@gkze"
      - name: Advance verified consumer dist-tag
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm dist-tag add "@gkze/opencode@$VERSION" "$NPM_DIST_TAG" --registry https://npm.pkg.github.com
